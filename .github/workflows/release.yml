name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build release binary
    runs-on: ubuntu-22.04   # LTS base for widest glibc compatibility

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history so changelog generation works

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libncursesw5-dev \
            libfftw3-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev

      # Portable build: no -march=native, so the binary runs on any x86-64 CPU
      # and not just the exact microarchitecture of the CI runner.
      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG" \
            -DNATIVE_ARCH=OFF \
            -DENABLE_PULSEAUDIO=ON \
            -DENABLE_PIPEWIRE=ON

      - name: Build
        run: cmake --build build --parallel $(nproc)

      # Guard: fail the release if CPU-specific flags ever sneak back in.
      - name: Verify portable flags
        run: |
          if grep -rq -- '-march=native' build/CMakeFiles/viz.dir/flags.make; then
            echo "::error::-march=native found in release build flags"
            exit 1
          fi

      - name: Strip binary
        run: strip build/viz

      - name: Verify binary
        run: |
          test -f build/viz
          file build/viz
          ldd  build/viz

      # Pack the prebuilt binary with everything install.sh needs to install it.
      # (The repo's top-level install.sh builds from source and cannot work
      # inside a tarball that has no sources, so a dedicated installer is
      # shipped under the same name.)
      #   viz-vX.Y.Z-linux-x86_64/
      #     viz  viz.1  completions/  examples/  LICENSE  README.md
      #     install.sh    (scripts/install-prebuilt.sh)
      #     uninstall.sh
      - name: Package tarball
        run: |
          VERSION="${{ github.ref_name }}"
          PKG="viz-${VERSION}-linux-x86_64"
          mkdir -p "${PKG}/completions" "${PKG}/examples"
          cp build/viz                       "${PKG}/"
          cp man/viz.1                       "${PKG}/"
          cp completions/viz.bash completions/viz.zsh completions/viz.fish \
                                             "${PKG}/completions/"
          cp examples/*.theme                "${PKG}/examples/"
          cp LICENSE README.md uninstall.sh  "${PKG}/"
          cp scripts/install-prebuilt.sh     "${PKG}/install.sh"
          chmod +x "${PKG}/install.sh" "${PKG}/uninstall.sh"
          tar -czf "${PKG}.tar.gz" "${PKG}"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
          echo "ASSET=${PKG}.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKSUM=${PKG}.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "viz ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}
