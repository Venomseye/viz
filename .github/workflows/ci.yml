name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "LICENSE"

# Cancel any in-progress run for the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 1. Format (check only) ───────────────────────────────────────────────────
  #
  # CI never rewrites or pushes to your branches.  If this fails:
  #   * easiest : Actions tab -> "Format code" -> Run workflow (commits the fix)
  #   * or      : download the "format-patch" artifact and run `git apply`
  #   * or      : run scripts/format.sh locally (needs clang-format-18)
  #
  format:
    name: "Format (clang-format)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Check formatting
        run: |
          CLANG_FORMAT=clang-format-18 bash scripts/format.sh
          if ! git diff --quiet; then
            git diff > format.patch
            git diff --stat
            echo "::error::Not clang-format clean. Run the 'Format code' workflow, or apply the 'format-patch' artifact."
            exit 1
          fi

      - name: Upload fix as a patch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: format-patch
          path: format.patch
          if-no-files-found: ignore

  # ── 2. Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: "Lint (clang-tidy)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-18 clang-tidy-18 jq \
            cmake ninja-build \
            libfftw3-dev libncursesw5-dev \
            libpipewire-0.3-dev libpulse-dev \
            pkg-config

      - name: Configure (generate compile_commands.json)
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          # Lint exactly the translation units CMake compiles, minus the CAVA
          # algorithm file.
          jq -r '.[].file' build/compile_commands.json \
            | grep '/src/' | grep -v 'fft_processor\.cpp' | sort -u \
            | xargs clang-tidy-18 -p build --quiet 2>&1 | tee tidy.log

          if grep -qE ' (error|warning):' tidy.log; then
            echo "::error::clang-tidy found issues — see log above."
            exit 1
          fi
          echo "clang-tidy: no issues found."

  # ── 3. Build + test ──────────────────────────────────────────────────────────
  #
  #   • Release    — what users get; binary uploaded as an artifact
  #   • Debug+ASan — CMake's Debug flags enable AddressSanitizer + UBSan
  #
  # ctest runs the registered suites (config, user_theme, fft_processor) in
  # BOTH configurations.
  #
  build:
    name: "Build + test / ${{ matrix.cfg.label }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - label: Release
            type: Release
          - label: "Debug+ASan"
            type: Debug

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libfftw3-dev libncursesw5-dev \
            libpipewire-0.3-dev libpulse-dev \
            pkg-config

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.cfg.type }} \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      # Newer runner kernels use a mmap entropy that older ASan runtimes
      # can't map; lowering it is the standard workaround.
      - name: ASan/ASLR workaround
        if: matrix.cfg.type == 'Debug'
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

      - name: Upload binary artifact
        if: matrix.cfg.label == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: viz-linux-x86_64
          path: build/viz
          retention-days: 7
